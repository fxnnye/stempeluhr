<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Stempeluhr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body { margin: 0; }

/* Layout: kiosk terminal (clock + keypad + presence board) and a locked admin ledger on the same page */
:root {
  --bg: #E7ECEF;
  --surface: #F8FAFB;
  --sunk: #DDE3E7;
  --ink: #141C24;
  --muted: #56636E;
  --line: #C8D1D7;
  --accent: #1D5C63;
  --accent-ink: #FFFFFF;
  --in: #2B7A4B;
  --in-soft: #D8EEE0;
  --warn: #9A5A08;
  --warn-soft: #F6E6CF;
  --danger: #B3261E;
  --danger-soft: #F7DEDB;
  --f-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1418; --surface: #162027; --sunk: #0B1014; --ink: #E4EAED; --muted: #8E9DA7; --line: #29353D;
    --accent: #62B4B2; --accent-ink: #081113; --in: #5DC389; --in-soft: #16301F; --warn: #E2A652; --warn-soft: #33250E;
    --danger: #F08A82; --danger-soft: #3A1916; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1418; --surface: #162027; --sunk: #0B1014; --ink: #E4EAED; --muted: #8E9DA7; --line: #29353D;
  --accent: #62B4B2; --accent-ink: #081113; --in: #5DC389; --in-soft: #16301F; --warn: #E2A652; --warn-soft: #33250E;
  --danger: #F08A82; --danger-soft: #3A1916; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 48px; }

/* top bar */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 4px 20px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 22px; margin: 0; letter-spacing: -0.01em; }
.brand span { color: var(--muted); font-size: 13px; }
.tabs { display: inline-flex; background: var(--sunk); border-radius: 10px; padding: 3px; gap: 2px; }
.tabs button { border: 0; background: transparent; padding: 7px 14px; border-radius: 8px; font-weight: 500; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }

/* terminal */
.terminal { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.clockface { padding-block: 8px; }
.clockface .time { font-family: var(--f-mono); font-weight: 500; font-size: clamp(56px, 11vw, 112px); line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.clockface .time small { font-size: .42em; color: var(--muted); letter-spacing: 0; margin-left: .15em; }
.clockface .date { font-family: var(--f-display); font-size: 20px; color: var(--muted); margin-top: 10px; }
.clockface .hint { margin-top: 28px; color: var(--muted); max-width: 42ch; font-size: 14px; }

.pad { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; min-height: 440px; display: flex; flex-direction: column; }
.pad-label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.slots { display: flex; gap: 10px; margin-block: 12px 6px; }
.slot { flex: 1; height: 58px; border-radius: 10px; background: var(--sunk); display: grid; place-items: center; font-family: var(--f-mono); font-size: 28px; border: 2px solid transparent; }
.slot.filled::after { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--ink); }
.slot.next { border-color: var(--accent); }
.pad-msg { min-height: 24px; font-size: 14px; color: var(--danger); }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 8px; }
.key { height: 60px; border-radius: 12px; border: 1px solid var(--line); border-bottom-width: 3px; background: var(--bg); font-family: var(--f-mono); font-size: 24px; font-weight: 500; touch-action: manipulation; }
.key:active { transform: translateY(2px); border-bottom-width: 1px; }
.key.fn { font-family: var(--f-body); font-size: 14px; color: var(--muted); }

.confirm { display: flex; flex-direction: column; gap: 14px; flex: 1; }
.confirm .who { font-family: var(--f-display); font-size: 30px; font-weight: 700; line-height: 1.15; text-wrap: balance; }
.confirm .status { color: var(--muted); }
.confirm .status b { color: var(--ink); font-weight: 600; }
.big-btn { border: 0; border-radius: 14px; padding: 22px; font-family: var(--f-display); font-size: 26px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
.big-btn .num { font-size: 20px; font-weight: 500; opacity: .85; }
.big-btn.in { background: var(--in); color: var(--accent-ink); }
.big-btn.out { background: var(--accent); color: var(--accent-ink); }
.ghost { border: 1px solid var(--line); background: transparent; border-radius: 10px; padding: 10px 14px; font-weight: 500; }
.done { flex: 1; display: grid; place-content: center; text-align: center; gap: 8px; }
.done .tick { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 6px; display: grid; place-items: center; font-size: 30px; color: var(--accent-ink); }
.done .tick.in { background: var(--in); } .done .tick.out { background: var(--accent); }
.done .big { font-family: var(--f-display); font-size: 26px; font-weight: 700; }
.done .sub { color: var(--muted); }

.board { grid-column: 1 / -1; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.section-head h2 { font-family: var(--f-display); font-size: 18px; margin: 0; font-weight: 700; }
.section-head .meta { color: var(--muted); font-size: 13px; }
.presence { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.pchip { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.pchip .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); flex: none; }
.pchip.in .dot { background: var(--in); box-shadow: 0 0 0 3px var(--in-soft); }
.pchip.warn .dot { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
.pchip .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pchip .s { font-size: 12px; color: var(--muted); }
.pchip > div { min-width: 0; }

/* admin */
.lock { max-width: 380px; margin: 40px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
.lock h2 { font-family: var(--f-display); margin: 0; font-size: 22px; }
.lock p { margin: 0; color: var(--muted); font-size: 14px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.input { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 9px 11px; min-width: 0; width: 100%; }
.btn { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 10px 16px; font-weight: 600; }
.btn:disabled { opacity: .5; cursor: default; }
.err { color: var(--danger); font-size: 14px; min-height: 20px; }
.ok { color: var(--in); font-size: 14px; min-height: 20px; }

.admin { display: flex; flex-direction: column; gap: 28px; }
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.toolbar .spacer { flex: 1; }
.period-label { font-family: var(--f-display); font-size: 20px; font-weight: 700; min-width: 0; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 36px; height: 36px; font-size: 18px; line-height: 1; }
.seg { display: inline-flex; background: var(--sunk); border-radius: 8px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 6px; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 12px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
.sumrow { cursor: pointer; }
.sumrow:hover td { background: var(--bg); }
.sumrow.sel td { background: var(--bg); }
.sumrow.sel td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.barcell { width: 38%; min-width: 120px; }
.hbar { height: 8px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
.hbar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.pill { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
.pill.in { background: var(--in-soft); color: var(--in); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.muted { background: var(--sunk); color: var(--muted); }
tfoot td { font-weight: 600; border-top: 1px solid var(--line); }

.detail { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.days { padding: 6px 0; }
.day { padding: 10px 16px; border-bottom: 1px solid var(--line); }
.day:last-child { border-bottom: 0; }
.day-h { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; margin-bottom: 4px; }
.day-h .num { color: var(--muted); font-weight: 500; }
.entry { display: flex; align-items: center; gap: 10px; padding: 5px 0; flex-wrap: wrap; }
.entry .span { font-family: var(--f-mono); font-variant-numeric: tabular-nums; min-width: 128px; }
.entry .dur { font-family: var(--f-mono); color: var(--muted); font-size: 14px; }
.entry .acts { margin-left: auto; display: flex; gap: 6px; }
.link { border: 0; background: none; color: var(--accent); padding: 2px 4px; font-size: 13px; font-weight: 600; }
.link.danger { color: var(--danger); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.form { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.form h3 { margin: 0; font-family: var(--f-display); font-size: 17px; }
.row3 { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.staff-grid td .input { max-width: 260px; }
.code-in { max-width: 110px !important; font-family: var(--f-mono); letter-spacing: .15em; }

.notice { background: var(--warn-soft); color: var(--ink); border-radius: 12px; padding: 14px 16px; font-size: 14px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); }

@media (max-width: 820px) {
  .terminal, .detail { grid-template-columns: minmax(0, 1fr); }
  .pad { min-height: 0; }
  .clockface .hint { display: none; }
  .row3 { grid-template-columns: 1fr 1fr; }
  .row3 .field:first-child { grid-column: 1 / -1; }
  .barcell { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.matrix { max-height: none; }
table.mt { width: max-content; min-width: 100%; font-size: 13px; }
table.mt th, table.mt td { padding: 8px 6px; border-bottom: 1px solid var(--line); }
table.mt th.c { text-align: center; font-size: 12px; text-transform: none; letter-spacing: 0; line-height: 1.2; }
table.mt th.c span { color: var(--muted); font-weight: 500; font-size: 11px; }
table.mt td.c { text-align: center; min-width: 40px; }
table.mt .we { background: var(--sunk); }
table.mt th.who { position: sticky; left: 0; background: var(--surface); text-align: left; padding-inline: 14px; z-index: 1; white-space: nowrap; text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--ink); box-shadow: 1px 0 0 var(--line); }
table.mt thead th.who { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
table.mt .tot { font-weight: 700; padding-inline: 12px; border-left: 1px solid var(--line); }
table.mt tfoot th, table.mt tfoot td { font-weight: 600; border-top: 1px solid var(--line); border-bottom: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="brand"><h1>Stempeluhr</h1><span id="connState"></span></div>
    <div class="tabs" role="tablist">
      <button id="tabTerm" role="tab" aria-selected="true">Stempeln</button>
      <button id="tabAdmin" role="tab" aria-selected="false">Verwaltung</button>
    </div>
  </header>

  <div id="notice" class="notice" hidden></div>

  <main id="viewTerm" class="terminal">
    <section class="clockface">
      <div class="time" id="bigTime">--:--<small>--</small></div>
      <div class="date" id="bigDate">&nbsp;</div>
      <p class="hint">Code eingeben, dann <b>Kommen</b> oder <b>Gehen</b> bestätigen. Die Zeit läuft weiter, auch wenn Sie die Seite schließen, bis Sie sich wieder ausstempeln.</p>
    </section>
    <section class="pad" id="pad" aria-live="polite"></section>
    <section class="board">
      <div class="section-head"><h2>Anwesenheit</h2><span class="meta" id="boardMeta"></span></div>
      <div class="presence" id="presence"><div class="pchip"><div><div class="n">Wird geladen …</div></div></div></div>
    </section>
  </main>

  <main id="viewAdmin" hidden></main>
</div>
<div id="toast" class="toast" hidden></div>

<script>


(() => {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const DAY = 86400000;
  const LONG_OPEN = 12 * 3600000;
  const WD = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
  const WDS = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
  const MON = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
  const p2 = (n) => String(n).padStart(2, "0");
  const hm = (ts) => { const d = new Date(ts); return p2(d.getHours()) + ":" + p2(d.getMinutes()); };
  const dmy = (d) => p2(d.getDate()) + "." + p2(d.getMonth() + 1) + "." + d.getFullYear();
  const dur = (ms) => { const m = Math.max(0, Math.round(ms / 60000)); return Math.floor(m / 60) + ":" + p2(m % 60); };
  const dayKey = (ts) => { const d = new Date(ts); return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()); };
  const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const isoWeek = (d) => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const n = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - n); const y = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y) / DAY + 1) / 7); };

  /* ---------- lokaler Speicher (nur dieses Gerät) ---------- */
  const KEY = "stempeluhr.v1";
  let stored = false;
  const START_CODES = ['8108', '6396', '8127', '6017', '5085', '2091'];
  const START_PIN = "196029";
  function seed() {
    return { staff: START_CODES.map((c, i) => ({ id: "m" + (i + 1), name: "Mitarbeiter " + (i + 1), code: c })), shifts: [], pin: START_PIN };
  }
  function loadDB() {
    try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && Array.isArray(d.staff) && Array.isArray(d.shifts)) { stored = true; return d; } } catch (e) {}
    return seed();
  }
  let DB = loadDB();
  let storageOk = true;
  function saveDB() {
    try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) { storageOk = false; showStorageWarn(); }
  }
  function showStorageWarn() {
    const n = $("#notice"); if (!n) return;
    n.textContent = "Der Browser erlaubt kein Speichern (privater Modus?). Zeiten gehen beim Schließen der Seite verloren. Bitte in einem normalen Safari-Fenster öffnen.";
    n.hidden = false;
  }

  let pinFails = 0, pinLockUntil = 0, codeFails = 0, codeLockUntil = 0;
  const fail = (code) => { const e = new Error(code); e.code = code; throw e; };
  const openOf = (id) => DB.shifts.find((s) => s.emp === id && s.end == null);
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  function byCode(code) {
    if (Date.now() < codeLockUntil) fail("locked");
    const s = DB.staff.find((x) => x.code === String(code));
    if (!s) { if (++codeFails >= 10) { codeLockUntil = Date.now() + 60000; codeFails = 0; } fail("bad_code"); }
    codeFails = 0; return s;
  }
  function checkPin(pin) {
    if (Date.now() < pinLockUntil) fail("locked");
    if (!DB.pin || String(pin) !== DB.pin) { if (++pinFails >= 5) { pinLockUntil = Date.now() + 60000; pinFails = 0; } fail("bad_pin"); }
    pinFails = 0;
  }

  function route(a, d) {
    switch (a) {
      case "status":
        return { ok: true, pinSet: !!DB.pin, staff: DB.staff.map((s) => ({ id: s.id, name: s.name, since: openOf(s.id)?.start ?? null })) };
      case "lookup": { const s = byCode(d.code); return { ok: true, name: s.name, since: openOf(s.id)?.start ?? null }; }
      case "stamp": {
        const s = byCode(d.code), o = openOf(s.id), now = Date.now(), kind = o ? "out" : "in";
        if (d.want && d.want !== kind) fail("state_changed");
        if (o) { o.end = now; saveDB(); return { ok: true, kind, name: s.name, time: now, worked: now - o.start }; }
        DB.shifts.push({ id: newId(), emp: s.id, start: now, end: null, src: "terminal" }); saveDB();
        return { ok: true, kind, name: s.name, time: now };
      }
      case "setPin":
        if (DB.pin) fail("bad_pin");
        if (!/^\d{4,8}$/.test(String(d.newPin))) fail("bad_pin_format");
        DB.pin = String(d.newPin); saveDB(); return { ok: true };
      case "adminData":
        checkPin(d.pin);
        return { ok: true, staff: DB.staff.map((s) => ({ ...s })),
          shifts: DB.shifts.filter((s) => s.start >= d.from && s.start < d.to).sort((x, y) => x.start - y.start).map((s) => ({ ...s })),
          open: DB.shifts.filter((s) => s.end == null).map((s) => ({ id: s.id, emp: s.emp, start: s.start })) };
      case "adminShift": {
        checkPin(d.pin);
        const start = Number(d.start), end = d.end == null ? null : Number(d.end);
        if (!isFinite(start) || (end != null && (!isFinite(end) || end <= start))) fail("bad_time");
        if (!DB.staff.some((s) => s.id === d.emp)) fail("bad_time");
        if (end == null) { const o = openOf(d.emp); if (o && o.id !== d.id) fail("already_open"); }
        if (d.id) { const cur = DB.shifts.find((s) => s.id === d.id); if (!cur) fail("bad_time"); Object.assign(cur, { emp: d.emp, start, end, src: "admin" }); }
        else DB.shifts.push({ id: newId(), emp: d.emp, start, end, src: "admin" });
        saveDB(); return { ok: true };
      }
      case "adminDelete": checkPin(d.pin); DB.shifts = DB.shifts.filter((s) => s.id !== d.id); saveDB(); return { ok: true };
      case "adminStaff": {
        checkPin(d.pin);
        const codes = new Set();
        d.staff.forEach((s) => { if (!s.name) fail("bad_name"); if (!/^\d{4}$/.test(s.code)) fail("bad_code_format"); if (codes.has(s.code)) fail("dup_code"); codes.add(s.code); });
        d.staff.forEach((s) => { const cur = DB.staff.find((x) => x.id === s.id); if (cur) { cur.name = s.name; cur.code = s.code; } });
        saveDB(); return { ok: true };
      }
      case "adminPin":
        checkPin(d.pin);
        if (!/^\d{4,8}$/.test(String(d.newPin))) fail("bad_pin_format");
        DB.pin = String(d.newPin); saveDB(); return { ok: true };
      case "adminExport": checkPin(d.pin); return { ok: true, data: { staff: DB.staff, shifts: DB.shifts } };
      case "adminImport": {
        checkPin(d.pin);
        const x = d.data;

      box.querySelectorAll("[data-del]").forEach((b) => (b.onclick = async () => {
        const id = b.dataset.del;
        if (S.delArm !== id) { S.delArm = id; renderDetail(); return; }
        S.delArm = null;
        try { await api("adminDelete", { pin: S.pin, id }); toast("Eintrag gelöscht"); if (S.editId === id) S.editId = null; loadAdmin(true); } catch (e) { toast(errMsg(e)); }
      }));
    }
    renderForm();
  }

  function renderForm() {
    const emp = admStaff(S.sel); if (!emp) return;
    const ed = S.editId ? S.adm.shifts.find((s) => s.id === S.editId) : null;
    if (S.editId && !ed) S.editId = null;
    const toDate = (ts) => { const d = new Date(ts); return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()); };
    const P = period();
    const defDate = Date.now() >= P.from && Date.now() < P.to ? Date.now() : P.from;
    $("#entryForm").innerHTML = `<form class="form" id="shiftForm">
      <h3>${ed ? "Eintrag bearbeiten" : "Eintrag nachtragen"}</h3>
      <div class="row3">
        <div class="field"><label for="fDate">Datum</label><input class="input" type="date" id="fDate" required value="${toDate(ed ? ed.start : defDate)}"></div>
        <div class="field"><label for="fFrom">Kommen</label><input class="input" type="time" id="fFrom" required value="${ed ? hm(ed.start) : "08:00"}"></div>
        <div class="field"><label for="fTo">Gehen</label><input class="input" type="time" id="fTo" value="${ed ? (ed.end != null ? hm(ed.end) : "") : "16:30"}"></div>
      </div>
      <div style="font-size:13px;color:var(--muted)">Gehen leer lassen = noch eingestempelt. Liegt Gehen vor Kommen, zählt es als nächster Tag.</div>
      <div class="err" id="formErr"></div>
      <div class="row-btns"><button class="btn" id="formGo">${ed ? "Änderung speichern" : "Eintrag speichern"}</button>
      ${ed ? `<button type="button" class="ghost" id="cancelEdit">Abbrechen</button>` : ""}</div>
    </form>`;
    if (ed) $("#cancelEdit").onclick = () => { S.editId = null; renderForm(); };
    $("#shiftForm").onsubmit = async (e) => {
      e.preventDefault();
      const [y, m, d] = $("#fDate").value.split("-").map(Number);
      const [fh, fm] = $("#fFrom").value.split(":").map(Number);
      const start = +new Date(y, m - 1, d, fh, fm);
      let end = null;
      if ($("#fTo").value) {
        const [th, tm] = $("#fTo").value.split(":").map(Number);
        end = +new Date(y, m - 1, d, th, tm);
        if (end <= start) end = +new Date(y, m - 1, d + 1, th, tm);
      }
      if (isNaN(start)) { $("#formErr").textContent = "Bitte Datum und Kommen-Zeit angeben."; return; }
      $("#formGo").disabled = true;
      try {
        await api("adminShift", { pin: S.pin, id: ed ? ed.id : undefined, emp: emp.id, start, end });
        toast(ed ? "Änderung gespeichert" : "Eintrag gespeichert");
        S.editId = null; await loadAdmin(true); renderForm();
      } catch (err) { $("#formErr").textContent = errMsg(err); $("#formGo").disabled = false; }
    };
  }

  function renderStaff() {
    const card = $("#staffCard"); if (!card) return;
    card.innerHTML = `<form id="staffForm" autocomplete="off"><div class="tablewrap"><table class="staff-grid"><thead><tr><th>Name</th><th>Code</th></tr></thead><tbody>
      ${S.adm.staff.map((s) => `<tr><td><input class="input" id="n_${esc(s.id)}" value="${esc(s.name)}" maxlength="40" aria-label="Name"></td>
        <td><input class="input code-in" id="c_${esc(s.id)}" value="${esc(s.code)}" inputmode="numeric" maxlength="4" aria-label="Code"></td></tr>`).join("")}
      </tbody></table></div>
      <div class="form" style="border-top:1px solid var(--line)">
        <div class="err" id="staffErr"></div>
        <div class="row-btns"><button class="btn" id="staffGo">Namen & Codes speichern</button></div>
      </div></form>
      <form class="form" id="pinForm" style="border-top:1px solid var(--line)" autocomplete="off">
        <h3>Admin-PIN ändern</h3>
        <div class="row-btns" style="align-items:end">
          <div class="field" style="flex:1;min-width:160px"><label for="newPin">Neue PIN (4–8 Ziffern)</label><input class="input mono" id="newPin" type="password" inputmode="numeric" maxlength="8"></div>
          <button class="btn" id="pinGo">PIN ändern</button>
        </div>
        <div class="err" id="pinErr"></div>
      </form>`;
    $("#staffForm").onsubmit = async (e) => {
      e.preventDefault();
      const staff = S.adm.staff.map((s) => ({ id: s.id, name: $("#n_" + s.id).value.trim(), code: $("#c_" + s.id).value.trim() }));
      $("#staffGo").disabled = true;
      try { await api("adminStaff", { pin: S.pin, staff }); $("#staffErr").textContent = ""; toast("Namen & Codes gespeichert"); await loadAdmin(true); }
      catch (err) { $("#staffErr").textContent = errMsg(err); }
      $("#staffGo").disabled = false;
    };
    $("#pinForm").onsubmit = async (e) => {
      e.preventDefault();
      const v = $("#newPin").value.trim();
      $("#pinGo").disabled = true;
      try { await api("adminPin", { pin: S.pin, newPin: v }); S.pin = v; $("#newPin").value = ""; $("#pinErr").textContent = ""; toast("Admin-PIN geändert"); }
      catch (err) { $("#pinErr").textContent = errMsg(err); }
      $("#pinGo").disabled = false;
    };
  }

  function exportCsv() {
    const P = period();
    const num = (ms) => (ms / 3600000).toFixed(2).replace(".", ",");
    const q = (s) => `"${String(s).replace(/"/g, '""')}"`;
    const lines = [["Mitarbeiter", "Datum", "Kommen", "Gehen", "Stunden", "Hinweis"].join(";")];
    const order = (id) => S.adm.staff.findIndex((s) => s.id === id);
    [...S.adm.shifts].sort((a, b) => order(a.emp) - order(b.emp) || a.start - b.start).forEach((s) => {
      const emp = admStaff(s.emp); if (!emp) return;
      lines.push([q(emp.name), dmy(new Date(s.start)), hm(s.start), s.end != null ? hm(s.end) : "", num(shiftEnd(s) - s.start), s.end == null ? "noch offen" : s.src === "admin" ? "korrigiert" : ""].join(";"));
    });
    lines.push("", "Summe je Mitarbeiter;;;;;");
    const t = totals();
    S.adm.staff.forEach((s) => lines.push([q(s.name), "", "", "", num(t[s.id].ms), t[s.id].days.size + " Tage"].join(";")));
    const url = URL.createObjectURL(new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" }));
    const a = document.createElement("a"); a.href = url; a.download = `Arbeitszeiten-${P.file}.csv`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  /* ---------- boot ---------- */
  renderPad();
  $("#connState").textContent = "gespeichert auf diesem Gerät";
  saveDB();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  loadStatus();
})();
</script>
</body>
</html>
